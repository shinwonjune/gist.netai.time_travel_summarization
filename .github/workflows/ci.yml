# 정적 게이트 + 단위 테스트 CI (플랫폼고도화 J1-③)
# push/PR마다: ruff 린트 → mypy(점진 대상) → Kit 불필요 테스트.
# Kit 런타임(omni.*)이 필요한 테스트는 `kit` 마커로 표시하고 여기서 제외한다.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install ruff mypy pytest minio

      - name: Lint (ruff)
        run: ruff check gist/

      - name: Type check (mypy — 점진 대상 모듈)
        run: mypy

      - name: Unit tests (Kit 불필요 분량)
        run: pytest -m "not kit" -q

      - name: Pure-helper self-tests
        run: |
          python gist/netai/time_travel_summarization/automation/generate_episodes.py --self-test
          python gist/netai/time_travel_summarization/automation/remote_generation.py
          python gist/netai/time_travel_summarization/utils/vllm_client.py
